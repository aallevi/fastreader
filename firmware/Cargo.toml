[package]
name = "fastreader-firmware"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Fast reader firmware for the LCDWIKI ES3C28P (ESP32-S3, 2.8\" ILI9341V, FT6336G)"

[[bin]]
name = "fastreader"
path = "src/main.rs"
test = false
bench = false

[features]
# Opens every book at boot and logs load/pagination times and memory.
selftest = []
# Start the Wi-Fi web view at boot regardless of the setting (testing).
wifi-boot = []
# Go to deep sleep 5 s after boot (testing the wake path).
sleep-test = []

[dependencies]
reader-core = { path = "../crates/reader-core" }
reader-ui = { path = "../crates/reader-ui" }
embedded-graphics = "0.8"
esp-hal = { version = "1.0", features = ["esp32s3", "unstable"] }
esp-alloc = { version = "0.11", features = ["esp32s3"] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
mipidsi = "0.10"
nb = "1"
esp-storage = { version = "0.10", features = ["esp32s3"] }
embedded-storage = "0.3"
# Wi-Fi web view (versions as in esp-hal 1.2.2's embassy_access_point example)
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "wifi"] }
esp-rtos = { version = "0.4", features = ["esp32s3", "esp-radio", "embassy"] }
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-net = { version = "0.9", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "proto-ipv4"] }
edge-dhcp = "0.8"
edge-nal = "0.7"
edge-nal-embassy = "0.9"
embedded-io-async = "0.7"
static_cell = "2.1"
# microSD card: FAT file system over SPI, and our FAT32 formatter
embedded-sdmmc = { version = "0.10", default-features = false }
fat-format = { path = "../crates/fat-format" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
opt-level = "s"
