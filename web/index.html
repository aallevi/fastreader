<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast Reader</title>
<link rel="stylesheet" id="theme" href="/theme.css">
<style>
  /* Colours come from /theme.css, generated from the device's active theme. */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); color: var(--text);
         background: linear-gradient(var(--bg), var(--bg2)) fixed; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center;
           padding: 10px 16px; color: var(--bartext);
           background: linear-gradient(var(--bar), var(--bar2)); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  header h1 { font-size: 15px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .stat { font-size: 13px; opacity: .85; font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: rgba(127,127,127,.3); }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  main { max-width: 42em; margin: 16px auto 96px; padding: 28px clamp(16px, 5vw, 48px);
         background: var(--page); border: 1px solid var(--edge); border-radius: var(--radius);
         line-height: 1.65; font-size: 18px; }
  h2 { color: var(--heading); font-size: 1.4em; margin: 1.6em 0 .6em; }
  main > :first-child { margin-top: 0; }
  span { cursor: pointer; border-radius: 3px; }
  span:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  span.now { background: var(--accent); color: var(--accenttext); }
  span.read { color: var(--dim); }
  /* Bookmarked words: a small dog-ear before the word. */
  span.bm::before { content: ''; display: inline-block; width: .55em; height: .55em; margin-right: .15em;
                    background: linear-gradient(225deg, transparent 50%, var(--accent) 50%); vertical-align: .35em; }
  nav { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
        padding: 6px; border-radius: 999px; background: linear-gradient(var(--bar), var(--bar2));
        box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  nav button { font: inherit; font-size: 14px; min-width: 44px; height: 40px; border: 0; border-radius: 999px;
               color: var(--bartext); background: transparent; cursor: pointer; }
  nav button:hover { background: rgba(255,255,255,.15); }
  nav button.main { background: var(--accent); color: var(--accenttext); min-width: 64px; }
  .follow { font-size: 12px; display: flex; align-items: center; gap: 4px; color: var(--bartext); padding: 0 8px; }
  /* Settings drawer: steppers and dropdowns only (no sliders), like the device. */
  #gear { background: transparent; border: 1px solid color-mix(in srgb, var(--bartext) 40%, transparent); color: var(--bartext);
          border-radius: var(--radius); height: 30px; padding: 0 10px; font: inherit; font-size: 13px; cursor: pointer; }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100vw); z-index: 5; overflow-y: auto;
          background: var(--page); color: var(--text); border-left: 1px solid var(--edge); box-shadow: -8px 0 24px rgba(0,0,0,.25);
          transform: translateX(100%); transition: transform .2s; padding: 12px 16px 80px; }
  aside.open { transform: none; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 18px 0 6px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent); }
  .row label { font-size: 14px; }
  .row small { display: block; color: var(--dim); font-size: 11px; }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button, .row select, .toggle { font: inherit; font-size: 14px; height: 32px; border-radius: var(--radius);
          border: 1px solid var(--btnedge); background: var(--btn); color: var(--btntext); cursor: pointer; }
  .step button { width: 34px; }
  .step output { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; }
  .row select { max-width: 190px; padding: 0 6px; }
  .toggle { min-width: 64px; }
  .toggle[aria-pressed=true] { background: var(--sel); color: var(--seltext); }
  aside .close { position: sticky; top: 0; float: right; }
</style>
</head>
<body>
<header><h1 id="title">Fast Reader</h1><span class="stat" id="wpm"></span><span class="stat" id="pct"></span><button id="gear" aria-controls="settings">Settings</button></header>
<aside id="settings" aria-label="Reader settings"><button class="toggle close" id="closeSet">Close</button>
  <h3>Add a book</h3>
  <div class="row"><label for="file">EPUB, Markdown or text<small>PDFs: convert on the computer first (tools/convert.py)</small></label></div>
  <div class="row"><input type="file" id="file" accept=".epub,.md,.txt,text/plain"></div>
  <div class="row"><button class="toggle" id="send" disabled>Send to the reader</button><small id="upmsg" role="status"></small></div>
  <div class="row"><button class="toggle" id="clearBooks">Remove uploaded books</button></div>
  <div id="setBody">Loading…</div></aside>
<div class="bar"><div id="prog"></div></div>
<div id="less" aria-hidden="true"></div>
<main id="book">Loading…</main>
<div id="more" aria-hidden="true"></div>
<nav aria-label="Device controls">
  <button data-k="left" title="Previous sentence">◀</button>
  <button data-k="down" title="Slower">−</button>
  <button data-k="select" class="main" id="play" title="Play / pause">▶</button>
  <button data-k="up" title="Faster">+</button>
  <button data-k="right" title="Next sentence">▶▶</button>
  <label class="follow"><input type="checkbox" id="follow" checked> follow</label>
</nav>
<script>
// Click any word to jump the device there. The page follows the device.
// Big books load in pieces: the text around the reader first, more as you
// scroll towards either end (the device can't send 5 MB of HTML at once).
let cur = -1, theme = -1, book = -1, len = 0, from = 0, to = 0, busy = false;
const $ = id => document.getElementById(id);
const WINDOW = 3000;
async function fetchRange(a, count) {
  const r = await fetch(`/book?from=${a}&count=${count}`);
  const [x, y] = (r.headers.get('X-Range') || '0-0').split('-').map(Number);
  return {x, y, html: await r.text()};
}
async function loadAround(pos) {
  busy = true;
  const {x, y, html} = await fetchRange(Math.max(0, pos - WINDOW / 2), WINDOW);
  from = x; to = y; $('book').innerHTML = html; cur = -1;
  busy = false;
}
async function loadMore(down) {
  if (busy || (down ? to >= len : from <= 0)) return;
  busy = true;
  if (down) {
    const {y, html} = await fetchRange(to, WINDOW);
    $('book').insertAdjacentHTML('beforeend', html); to = y;
  } else {
    const before = document.documentElement.scrollHeight;
    const {x, html} = await fetchRange(Math.max(0, from - WINDOW), from - Math.max(0, from - WINDOW));
    $('book').insertAdjacentHTML('afterbegin', html); from = x;
    window.scrollBy(0, document.documentElement.scrollHeight - before);  // keep your place
  }
  busy = false;
}
new IntersectionObserver(es => es.forEach(e => e.isIntersecting && loadMore(e.target.id === 'more'))).observe($('more'));
new IntersectionObserver(es => es.forEach(e => e.isIntersecting && loadMore(false))).observe($('less'));
function word(i) { return document.getElementById('w' + i); }
async function mark(pos) {
  if (pos === cur) return;
  if (pos < from || pos >= to) await loadAround(pos);
  const old = word(cur);
  if (old) old.classList.remove('now');
  // Words before the reader are dimmed: toggle only the ones that changed.
  const lo = Math.max(from, Math.min(pos, cur < 0 ? from : cur)), hi = Math.min(to, Math.max(pos, cur));
  for (let i = cur < 0 ? from : lo; i < (cur < 0 ? pos : hi); i++) { const w = word(i); if (w) w.classList.toggle('read', i < pos); }
  if (cur >= 0 && pos < cur) for (let i = pos; i < cur; i++) { const w = word(i); if (w) w.classList.remove('read'); }
  cur = pos;
  const w = word(pos);
  if (w) { w.classList.add('now'); if ($('follow').checked) w.scrollIntoView({block: 'center', behavior: 'smooth'}); }
}
async function poll() {
  try {
    const s = await (await fetch('/state')).json();
    len = s.len;
    $('title').textContent = s.title; $('wpm').textContent = s.wpm + ' wpm';
    $('pct').textContent = Math.floor(s.permille / 10) + '%'; $('prog').style.width = s.permille / 10 + '%';
    $('play').textContent = s.playing ? '❚❚' : '▶';
    if (s.theme !== theme) { theme = s.theme; $('theme').href = '/theme.css?' + theme; }
    if (s.book !== book) { book = s.book; await loadAround(s.pos); }
    await mark(s.pos);
    document.querySelectorAll('span.bm').forEach(e => e.classList.remove('bm'));
    (s.bookmarks || []).forEach(i => { const w = word(i); if (w) w.classList.add('bm'); });
  } catch (e) {}
  setTimeout(poll, 300);
}
$('book').addEventListener('click', e => {
  const s = e.target.closest('span[id^=w]');
  if (s) fetch('/seek?w=' + s.id.slice(1), {method: 'POST'});
});
document.querySelectorAll('nav button').forEach(b =>
  b.addEventListener('click', () => fetch('/key?k=' + b.dataset.k, {method: 'POST'})));

// ---- settings: every option the device has, changed through the same core
// validation (/set clamps and refuses unknown names).
const X = v => (v / 10).toFixed(1) + '×';
const GROUPS = [
  ['Reading', [
    ['book', 'Book', 'books'], ['mode', 'Reading mode', 'modes'], ['wpm', 'Speed', 'step', 25, v => v + ' wpm'], ['true_pace', 'Speed means', 'toggle', ['Base rate', 'Real pace']],
    ['chunk', 'Words per flash (word mode)', 'step', 1, v => v], ['phrase', 'Words per group (phrase & page modes)', 'step', 1, v => v],
    ['skip', 'Skip buttons jump', 'skips'], ['context', 'Sentence under the word when paused', 'toggle', ['Off', 'On']]]],
  ['Pauses', [
    ['comma', 'After , ; :', 'step', 1, X], ['sentence', 'After . ! ?', 'step', 1, X],
    ['paragraph', 'After a paragraph', 'step', 1, X], ['title', 'Chapter titles', 'step', 1, X],
    ['long_words', 'Extra time for long words', 'toggle', ['Off', 'On']], ['ramp', 'Ease in after play', 'toggle', ['Off', 'On']],
    ['aside', 'Speed inside ( … ), tenths of normal time: 8 = a little faster', 'range']]],
  ['Look', [
    ['theme', 'Theme', 'themes'], ['font', 'Font', 'fonts'], ['size', 'Text size', 'sizes'],
    ['parens', 'Parentheses (word & phrase modes)', 'parens']]],
  ['Page mode', [
    ['spacing', 'Line spacing', 'spacings'], ['indent', 'Paragraphs', 'paragraphs'], ['justify', 'Alignment', 'aligns'],
    ['highlight', 'Highlight the phrase when paused', 'toggle', ['Off', 'On']]]],
  ['Device', [
    ['brightness', 'Brightness', 'brightness'], ['flipped', 'Rotate screen', 'toggle', ['0°', '180°']]]],
];
let S = null;
async function setSetting(name, value) {
  const r = await fetch(`/set?name=${name}&value=${value}`, {method: 'POST'});
  if (r.ok) { S = await r.json(); renderSettings(); }
}
function renderSettings() {
  const f = S.fields, body = $('setBody'); body.innerHTML = '';
  for (const [group, rows] of GROUPS) {
    const h = document.createElement('h3'); h.textContent = group; body.appendChild(h);
    for (const [name, label, kind, a, fmt] of rows) {
      if (!f[name]) continue;
      const row = document.createElement('div'); row.className = 'row';
      const lab = document.createElement('label'); lab.textContent = label; row.appendChild(lab);
      const v = f[name].value;
      if (kind === 'step') {
        const box = document.createElement('div'); box.className = 'step';
        const minus = document.createElement('button'); minus.textContent = '−'; minus.setAttribute('aria-label', label + ' down');
        const out = document.createElement('output'); out.textContent = fmt(v);
        const plus = document.createElement('button'); plus.textContent = '+'; plus.setAttribute('aria-label', label + ' up');
        minus.disabled = v <= f[name].min; plus.disabled = v >= f[name].max;
        minus.onclick = () => setSetting(name, Math.max(f[name].min, v - a));
        plus.onclick = () => setSetting(name, Math.min(f[name].max, v + a));
        box.append(minus, out, plus); row.appendChild(box);
      } else if (kind === 'toggle') {
        const b = document.createElement('button'); b.className = 'toggle';
        b.setAttribute('aria-pressed', v ? 'true' : 'false'); b.textContent = a[v ? 1 : 0];
        b.onclick = () => setSetting(name, v ? 0 : 1); row.appendChild(b);
      } else {
        const sel = document.createElement('select'); sel.setAttribute('aria-label', label);
        (S[kind] || []).forEach((n, i) => { const o = new Option(n, i); o.selected = i === v; sel.add(o); });
        sel.onchange = () => setSetting(name, sel.value); row.appendChild(sel);
      }
      body.appendChild(row);
    }
  }
}
$('gear').onclick = async () => { S = await (await fetch('/settings')).json(); renderSettings(); $('settings').classList.add('open'); };
$('closeSet').onclick = () => $('settings').classList.remove('open');

// ---- add a book: EPUBs are converted here in the browser (unzip + XHTML →
// the reader's markup), so a phone on the reader's Wi-Fi needs nothing else.
async function unzip(buf) {
  const v = new DataView(buf), files = {};
  let e = buf.byteLength - 22;
  while (e > 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  let p = v.getUint32(e + 16, true);
  const n = v.getUint16(e + 10, true);
  for (let i = 0; i < n; i++) {
    const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true);
    const nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true);
    const local = v.getUint32(p + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nl));
    const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
    const data = new Uint8Array(buf, start, size);
    files[name] = method === 0 ? data
      : new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    p += 46 + nl + xl + cl;
  }
  return files;
}
function toMarkup(doc, docPath) {
  const out = [];
  const dir = docPath.includes('/') ? docPath.replace(/[^/]*$/, '') : '';
  const resolve = src => {
    const parts = [];
    for (const seg of (dir + decodeURIComponent(src.split('#')[0])).split('/')) {
      if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg);
    }
    return parts.join('/');
  };
  const walk = (node, b, i) => {
    let t = '';
    for (const c of node.childNodes) {
      if (c.nodeType === 3) {
        const words = c.textContent.replace(/[*_]/g, '').split(/\s+/).filter(Boolean);
        const m = b && i ? '***' : b ? '**' : i ? '*' : '';
        t += (c.textContent.match(/^\s/) ? ' ' : '') + words.map(w => m + w + m).join(' ') + (c.textContent.match(/\s$/) ? ' ' : '');
      } else if (c.nodeType === 1) {
        const tag = c.localName;
        if (['script', 'style', 'sup', 'img', 'svg'].includes(tag)) continue;
        t += walk(c, b || tag === 'b' || tag === 'strong', i || tag === 'i' || tag === 'em' || tag === 'cite');
      }
    }
    return t;
  };
  for (const el of doc.querySelectorAll('h1,h2,h3,h4,p,li,blockquote,img,image')) {
    if (el.localName === 'img' || el.localName === 'image') {
      const src = el.getAttribute('src') || el.getAttribute('xlink:href') || el.getAttribute('href');
      if (src) out.push('\u0000IMG:' + resolve(src) + '\u0000');
      continue;
    }
    if (el.closest('p,li,blockquote') && el.closest('p,li,blockquote') !== el) continue;
    const text = walk(el, false, false).replace(/\s+/g, ' ').trim();
    if (!text) continue;
    out.push(/^h[1-4]$/.test(el.localName) ? '# ' + text.replace(/\*/g, '') : text);
  }
  return out.join('\n\n');
}
async function epubToMarkup(file) {
  const files = await unzip(await file.arrayBuffer());
  const xml = s => new DOMParser().parseFromString(new TextDecoder().decode(s), 'application/xhtml+xml');
  const opfPath = xml(files['META-INF/container.xml']).querySelector('rootfile').getAttribute('full-path');
  const opf = xml(files[opfPath]), base = opfPath.includes('/') ? opfPath.replace(/[^/]*$/, '') : '';
  const title = (opf.querySelector('title')?.textContent || file.name).trim();
  const items = {};
  opf.querySelectorAll('manifest item').forEach(it => items[it.getAttribute('id')] = it.getAttribute('href'));
  const parts = [];
  for (const ref of opf.querySelectorAll('spine itemref')) {
    const href = decodeURIComponent(items[ref.getAttribute('idref')] || '');
    const data = files[base + href];
    if (data) parts.push(toMarkup(xml(data), base + href));
  }
  let text = parts.filter(Boolean).join('\n\n');
  // Pictures: scaled to the reader's stage, RGB565, after the text.
  const pics = [], ids = {};
  let used = 0;
  for (const m of [...text.matchAll(/\u0000IMG:([^\u0000]*)\u0000/g)]) {
    const path = m[1];
    if (path in ids) continue;
    ids[path] = '';
    const data = files[path];
    if (!data || used > 2e6) continue;
    try {
      const bmp = await createImageBitmap(new Blob([data]));
      if (bmp.width < 48 || bmp.height < 48) continue;
      const k = Math.min(300 / bmp.width, 190 / bmp.height, 1);
      const w = Math.max(1, Math.round(bmp.width * k)), h = Math.max(1, Math.round(bmp.height * k));
      if (used + w * h * 2 > 2e6) continue;
      const cv = new OffscreenCanvas(w, h), g = cv.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
      g.drawImage(bmp, 0, 0, w, h);
      const rgba = g.getImageData(0, 0, w, h).data, px = new Uint8Array(4 + w * h * 2);
      new DataView(px.buffer).setUint16(0, w, true); new DataView(px.buffer).setUint16(2, h, true);
      for (let i = 0, o = 4; i < rgba.length; i += 4, o += 2) {
        const v = (rgba[i] >> 3) << 11 | (rgba[i + 1] >> 2) << 5 | rgba[i + 2] >> 3;
        px[o] = v & 255; px[o + 1] = v >> 8;
      }
      ids[path] = `{image:${pics.length}}`;
      pics.push(px);
      used += w * h * 2;
    } catch (e) { /* not a picture the browser can read */ }
  }
  text = text.replace(/\u0000IMG:([^\u0000]*)\u0000/g, (_, p) => ids[p] || '').replace(/\n{3,}/g, '\n\n');
  let images = null;
  if (pics.length) {
    // "\n\0FRIMG1", count, then (w, h, pixels) per picture.
    images = new Blob([new Uint8Array([10, 0, 70, 82, 73, 77, 71, 49]), new Uint16Array([pics.length]), ...pics]);
  }
  return {title, text, images, pictures: pics.length};
}
let pending = null;
$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  $('send').disabled = true;
  $('upmsg').textContent = 'Reading…';
  try {
    pending = f.name.toLowerCase().endsWith('.epub')
      ? await epubToMarkup(f)
      : {title: f.name.replace(/\.[^.]*$/, ''), text: await f.text()};
    const kb = Math.round((new Blob([pending.text]).size + (pending.images?.size || 0)) / 1024);
    const pics = pending.pictures ? `, ${pending.pictures} pictures` : '';
    $('upmsg').textContent = `${pending.title}: ${kb} KB${pics} ready`;
    $('send').disabled = false;
  } catch (e) { $('upmsg').textContent = 'Could not read this file'; }
};
$('send').onclick = async () => {
  if (!pending) return;
  $('send').disabled = true;
  $('upmsg').textContent = 'Sending…';
  const body = new Blob([`<!-- title: ${pending.title} -->\n` + pending.text, ...(pending.images ? [pending.images] : [])]);
  const r = await fetch('/upload?title=' + encodeURIComponent(pending.title), {method: 'POST', body});
  $('upmsg').textContent = r.ok ? 'Saved: it is in the Library on the reader' : 'Failed: ' + await r.text();
  if (r.ok) setTimeout(async () => { S = await (await fetch('/settings')).json(); renderSettings(); }, 1500);
};
$('clearBooks').onclick = async () => {
  if (!confirm('Remove every book uploaded from the browser? Books built into the reader stay.')) return;
  await fetch('/books/clear', {method: 'POST'});
  $('upmsg').textContent = 'Uploaded books removed';
};
poll();
</script>
</body>
</html>
